name: Deploy site (data refreshed by server cron)
on:
  # No GitHub schedule: scheduled runs were delayed or dropped. The server runs
  # scripts/server_update.sh hourly and pushes public/data/latest.json; that push
  # triggers the deploy below. workflow_dispatch still allows a manual refresh.
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['README.md']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: haze-data
  cancel-in-progress: false
jobs:
  update:
    # Fetch on GitHub only when run by hand; pushes just deploy what was pushed.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aggregate official readings, advisories and news
        id: refresh
        continue-on-error: true
        env:
          DATA_GOV_SG_API_KEY: ${{ secrets.DATA_GOV_SG_API_KEY }}
        run: python3 scripts/update_data.py
      - name: Test data pipeline and dashboard logic
        run: |
          node --test tests/*.test.mjs
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Commit refreshed snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/latest.json
          if ! git diff --staged --quiet; then
            git commit -m "data: refresh Singapore haze snapshot"
            git push origin HEAD:main
          fi
      - name: Report critical upstream failures
        if: steps.refresh.outcome == 'failure'
        run: exit 1

  # Publish public/ as the site root, so the address is
  # https://smu-diga.github.io/singaporehaze2026/ (no /public/).
  # Requires Settings → Pages → Source: "GitHub Actions".
  deploy:
    needs: update
    # Deploy even when an upstream source failed (the last valid data is still
    # served) or when update was skipped on a push.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Assemble site
        run: |
          cp -R public _site
          # Keep old /public/ links working.
          mkdir -p _site/public
          printf '%s\n' '<!doctype html><meta charset="utf-8"><title>Singapore Haze Watch</title><meta http-equiv="refresh" content="0;url=../"><script>location.replace("../" + location.search + location.hash)</script><a href="../">Singapore Haze Watch →</a>' > _site/public/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
